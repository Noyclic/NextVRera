name: NextVRera Hardware Probe APK

on:
  pull_request:
    branches: [main]
    paths:
      - "hardware-probe/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/hardware-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextvrera-hardware-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build standalone hardware probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build hardware probe APK
        run: gradle --no-daemon :hardware-probe:assembleDebug

      - name: Validate APK
        run: |
          set -euo pipefail
          APK="hardware-probe/build/outputs/apk/debug/hardware-probe-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.noyclic.nextvrera.hardwareprobe'"
          APK_FILES="$(unzip -Z1 "$APK")"
          grep -qx "lib/arm64-v8a/libhardwareprobe.so" <<< "$APK_FILES"
          grep -qx "assets/mobilenet_v1_1.0_224_quant.tflite" <<< "$APK_FILES"

          # Catch the exact missing-class regression from the previous phone test.
          DEX_FILES="$(grep -E '^classes([0-9]+)?\.dex$' <<< "$APK_FILES")"
          test -n "$DEX_FILES"
          for dex in $DEX_FILES; do unzip -p "$APK" "$dex"; done | strings | grep -Fq 'GpuDelegateFactory$Options'

          # The optional FastRPC declaration lets Android expose the vendor RPC library where present.
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'libcdsprpc.so'
          echo "APK package, model, JNI, GPU API class and FastRPC manifest declaration validated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextVRera-hardware-probe-apk
          path: hardware-probe/build/outputs/apk/debug/hardware-probe-debug.apk
          if-no-files-found: error
          retention-days: 14
